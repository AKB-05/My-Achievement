   border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  
  body {
   margin: 0;
   font-family: 'Times New Roman', Times, serif, sans-serif;
   position: relative;
   min-height: 100vh;
   overflow-x: hidden;
  }

   html {
   background-color: #0a0f0a; /* Dark green/black background */
  }
  
  body {
   background-color: #0a0f0a;
   opacity: 0;
   animation: fadePageIn 0.5s ease-out forwards;
  }
  
  @keyframes fadePageIn {
   0% { opacity: 0; }
   100% { opacity: 1; }
  }

    /* Smooth page transition - prevents white flash */
  body {
   opacity: 0;
   animation: fadePageIn 0.5s ease-out forwards;
  }
  
  @keyframes fadePageIn {
   0% { opacity: 0; }
   100% { opacity: 1; }
  }
  
  /* Smooth fade when clicking links */
  a, button {
   transition: all 0.3s ease;
  }
  
  .blur-bg {
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background-image: url('Background.gif');
   background-size: cover;
   background-position: center;
   background-repeat: no-repeat;
   filter: blur(15px);
   z-index: 0;
  }
  
  .clear-bg {
   position: fixed;
   top: 50%;
   left: 50%;
   transform: translate(-50%, -50%);
   width: 80%;
   height: 80%;
   background-image: url('Background.gif');
   background-size: contain;
   background-position: center;
   background-repeat: no-repeat;
   z-index: 1;
   border: 3px solid rgba(255, 255, 255, 0.8);
   border-radius: 20px;
   box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
  }
  
  .top-nav {
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   background: rgba(0, 0, 0, 0.85);
   backdrop-filter: blur(10px);
   z-index: 100;
   box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
   border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  
  .nav-container {
   max-width: 1200px;
   margin: 0 auto;
   padding: 15px 30px;
   display: flex;
   justify-content: space-between;
   align-items: center;
   flex-wrap: wrap;
  }
  
  .logo {
   color: white;
   font-size: 1.5em;
   font-weight: bold;
   letter-spacing: 1px;
   text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
   background: linear-gradient(135deg, #fff, #b9e8ab);
   -webkit-background-clip: text;
   background-clip: text;
   color: transparent;
  }
  
  .nav-links {
   display: flex;
   gap: 30px;
   align-items: center;
   flex-wrap: wrap;
  }
  
  .nav-links a {
   color: white;
   text-decoration: none;
   font-size: 1.1em;
   padding: 8px 16px;
   border-radius: 25px;
   transition: all 0.3s ease;
   position: relative;
  }
  
  .nav-links a:hover {
   background: rgba(255, 255, 255, 0.2);
   transform: translateY(-2px);
  }
  
  .nav-links a::after {
   content: '';
   position: absolute;
   bottom: 0;
   left: 50%;
   width: 0;
   height: 2px;
   background: #b9e8ab;
   transition: all 0.3s ease;
   transform: translateX(-50%);
  }
  
  .nav-links a:hover::after {
   width: 70%;
  }
  
  .nav-links a.active {
   background: rgba(185, 232, 171, 0.2);
   border: 1px solid rgba(185, 232, 171, 0.5);
  }
  
  .main-content {
   position: relative;
   z-index: 2;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
   min-height: 100vh;
   padding-top: 80px;
   box-sizing: border-box;
  }
  
  h1 {
   color: rgb(255, 255, 255);
   font-size: 3em;
   text-shadow: 2px 2px 4px #000000;
   position: relative;
   z-index: 2;
   text-align: center;
   background: rgba(0, 0, 0, 0.6);
   padding: 20px 40px;
   border-radius: 15px;
   margin: 20px;
   display: inline-block;
   width: auto;
   border: 2px solid rgba(255, 255, 255, 0.7);
   box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.2);
   backdrop-filter: blur(5px);
   letter-spacing: 2px;
   animation: fadeInDown 0.8s ease-out;
  }

  h2 {
   color: rgb(255, 255, 255);
   font-size: 1.5em;
   text-shadow: 1px 1px 3px #000000;
   position: relative;
   z-index: 2;
   text-align: center;
   background: rgba(0, 0, 0, 0.6);
   padding: 12px 30px;
   border-radius: 50px;
   border: 2px solid rgba(255, 255, 255, 0.8);
   display: inline-block;
   cursor: pointer;
   transition: all 0.3s ease;
   backdrop-filter: blur(5px);
   margin-top: 10px;
   font-weight: normal;
   letter-spacing: 1px;
  }
  
  h2:hover {
   background: rgba(255, 255, 255, 0.2);
   transform: scale(1.05);
   border-color: rgba(185, 232, 171, 0.9);
   box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
   cursor: pointer;
  }
  
  .content {
   position: relative;
   z-index: 2;
   text-align: center;
   width: 100%;
   display: flex;
   flex-direction: column;
   align-items: center;
   justify-content: center;
  }
  
  @keyframes fadeInDown {
   0% { opacity: 0; transform: translateY(-30px); }
   100% { opacity: 1; transform: translateY(0); }
  }
  
  @media (max-width: 768px) {
   .nav-container { flex-direction: column; gap: 10px; padding: 10px; }
   .nav-links { gap: 15px; }
   .nav-links a { font-size: 0.9em; padding: 6px 12px; }
   h1 { font-size: 2em; padding: 15px 25px; }
   h2 { font-size: 1.2em; padding: 10px 20px; }
  }
 </style>
